optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.0005,
  weight_decay : 0.05
}}

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 300,
    initial_epochs : 10
}}

dataset : {
  train : { _base_: cfgs/dataset_configs/GSModel-60.yaml,
            others: {subset: 'train', norm_attribute: ['xyz']}},
  val : { _base_: cfgs/dataset_configs/GSModel-60.yaml,
            others: {subset: 'test', norm_attribute: ['xyz']}},
  test : { _base_: cfgs/dataset_configs/GSModel-60.yaml,
            others: {subset: 'test', norm_attribute: ['xyz']}}}
model : {
  NAME: PointTransformer_GAPromptPlus, # PointTransformer_best PointTransformer_pointtokenprompt
  trans_dim: 384,
  attribute: ['xyz'],
  group_attribute: ['xyz'],
  depth: 12,
  drop_path_rate: 0.1,
  if_half: False,
  cls_dim: 60,
  num_heads: 6,
  group_size: 32,
  num_group: 64,
  encoder_dims: 384,
  adapter_config: {
    adapter_dim: 12,
    adapter_drop_path_rate: 0.1,
  },
  point_number: 20,
  scale: 0.01,
  factor: 5,
  perturbation: 0.10,
  point_prompt: True,
  shift_net: True,
  prompt_layers: [0,1,2,3,4,5],
  prompt_granularity: [8, 4, 1],
  propagation_type: 'permutation_after_attention'
}


npoints: 1024
total_bs : 32
step_per_update : 1
max_epoch : 400
grad_norm_clip : 10
task: 'classification'
data_augmentation: 'rotation'
ckpts: 'pretrained_bases/point-pqae-ckpt-epoch-300.pth'
