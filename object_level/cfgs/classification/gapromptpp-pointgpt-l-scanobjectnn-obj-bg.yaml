optimizer: { type: AdamW, kwargs: { lr: 0.0001, weight_decay: 0.05 } }

scheduler: { type: CosLR, kwargs: { epochs: 300, initial_epochs: 10 } }
dataset:
  {
    train:
      {
        _base_: cfgs/dataset_configs/ScanObjectNN_objectbg.yaml,
        others: { subset: "train" },
      },
    val:
      {
        _base_: cfgs/dataset_configs/ScanObjectNN_objectbg.yaml,
        others: { subset: "test" },
      },
    test:
      {
        _base_: cfgs/dataset_configs/ScanObjectNN_objectbg.yaml,
        others: { subset: "test" },
      },
  }
model:
  {
    NAME: Gap_PointTransformer,
    trans_dim: 1024,
    depth: 24,
    drop_path_rate: 0.2,
    cls_dim: 15,
    num_heads: 16,
    group_size: 32,
    num_group: 128,
    encoder_dims: 1024,
    decoder_depth: 4,
    perturbation: 0.1,
    point_number: 20,
    prompt_depth: 12,
    prompt_propagation_after: False,
    head_dim: 3,
    legacy_prompt_tokens: 10,
  }

npoints: 2048
total_bs: 40
step_per_update: 1
max_epoch: 300
grad_norm_clip: 10
task: classification
legacy_full_checkpoint: true
