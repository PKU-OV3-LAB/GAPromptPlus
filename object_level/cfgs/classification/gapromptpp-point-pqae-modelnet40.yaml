optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.0005,
  weight_decay : 0.05
}}

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 300,
    initial_epochs : 10
}}

dataset : {
  train : { _base_: cfgs/dataset_configs/ModelNet40.yaml,
            others: {subset: 'train'}},
  val : { _base_: cfgs/dataset_configs/ModelNet40.yaml,
            others: {subset: 'test'}},
  test : { _base_: cfgs/dataset_configs/ModelNet40.yaml,
            others: {subset: 'test'}}}
model : {
  NAME: PointTransformer_GAPromptPlus,
  trans_dim: 384,
  depth: 12,
  drop_path_rate: 0.1,
  if_half: False,
  cls_dim: 40,
  num_heads: 6,
  group_size: 32,
  num_group: 64,
  encoder_dims: 384,
  adapter_config: {
    adapter_dim: 12,
    adapter_drop_path_rate: 0.1,
  },
  point_number: 10,
  scale: 0.005,
  factor: 5,
  perturbation: 0.05,
  point_prompt: True,
  shift_net: True,
  prompt_layers: [0,1,2,3,4,5],
  prompt_granularity: [4, 2, 1],
  propagation_type: 'permutation_after_attention'
}


npoints: 1024
total_bs : 64
step_per_update : 1
max_epoch : 400
grad_norm_clip : 10
task: 'classification'
data_augmentation: 'scale-translate'
ckpts: 'pretrained_bases/point-pqae-ckpt-epoch-300.pth'
